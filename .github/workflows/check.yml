# Checks a change before it reaches main, which GitHub Pages publishes as it is (Deploy from a branch, no build).
# Nothing here builds or deploys the site. There is no package.json: each tool is fetched at a fixed version with npx,
# and the actions are pinned to a commit (Dependabot proposes new ones, see .github/dependabot.yml).
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  files:
    name: Files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and the base it is compared with
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: The Serbian page is made from the current index.html and i18n.js
        if: hashFiles('tools/build-sr.mjs') != ''
        run: node tools/build-sr.mjs --check
      - name: Addresses, head, hreflang, JSON-LD, sitemap, llms.txt, IndexNow key
        run: node tools/check-site.mjs
      - name: HTML (every .html file in the repository, the guides with them)
        run: npx --yes html-validate@11.16.0 $(git ls-files '*.html')
      - name: A change of the text should move lastmod (a warning only)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '(^|/)index\.html$|^i18n\.js$' &&
            ! git diff HEAD^1 HEAD -- sitemap.xml | grep -q '^+.*<lastmod>'; then
            echo "::warning file=sitemap.xml,title=lastmod::a page or i18n.js changed, sitemap.xml's lastmod did not. If the text of a page changed, set its lastmod and the dateModified in its JSON-LD (on a guide also the date it shows) to the day it goes live."
          fi
      - name: A changed stylesheet or main.js should have a new ?v= stamp (a warning only)
        if: github.event_name == 'pull_request'
        run: |
          for file in styles.css main.js; do
            if git diff --name-only HEAD^1 HEAD | grep -qxF "$file" &&
              ! git diff HEAD^1 HEAD -- index.html | grep -q "^+.*$file?v="; then
              echo "::warning file=index.html,title=?v= stamp::$file changed, its ?v= stamp in index.html did not. Change the stamp (styles.css also in 404.html) and run node tools/build-sr.mjs, or a browser may keep the old $file for ten minutes."
            fi
          done

  lighthouse:
    name: Lighthouse
    needs: files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Serve the folder as GitHub Pages does
        run: |
          node tools/serve.mjs . 8080 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.5; done
      - name: Lighthouse, mobile, three runs of each page (the two home pages and one guide, the longest table)
        run: |
          mkdir -p lh
          for i in 1 2 3; do
            for page in / /sr/ /guides/image-generators-api-mcp/; do
              name=$(echo "$page" | tr -d /); name=${name:-en}
              npx --yes lighthouse@13.5.0 "http://127.0.0.1:8080$page" --quiet \
                --only-categories=performance,accessibility,best-practices,seo,agentic-browsing \
                --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output=html --output-path="lh/$name-$i"
            done
          done
      - name: Budgets
        run: node tools/lh-assert.mjs lh/*.report.json
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: lh/
          retention-days: 14
